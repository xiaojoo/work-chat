<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>群组调试</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .section { margin-bottom: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        h3 { margin-top: 0; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 5px; overflow-x: auto; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>群组调试工具</h1>

    <div class="section">
        <h3>1. 获取我的群组列表</h3>
        <button onclick="getMyGroups()">获取群组列表</button>
        <pre id="groupsResult">点击按钮获取数据...</pre>
    </div>

    <div class="section">
        <h3>2. 创建群组测试</h3>
        <input type="text" id="groupName" placeholder="群名" value="测试群" />
        <button onclick="createGroupTest()">创建群组</button>
        <pre id="createResult">点击按钮创建群组...</pre>
    </div>

    <div class="section">
        <h3>3. clearUnread 测试</h3>
        <input type="text" id="convId" placeholder="conversationId" value="" />
        <button onclick="clearUnreadTest()">清除未读</button>
        <pre id="clearResult">点击按钮测试...</pre>
    </div>

    <script>
        const token = localStorage.getItem('accessToken')
        const userId = localStorage.getItem('userId')

        function getHeaders() {
            return {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            }
        }

        async function getMyGroups() {
            try {
                const response = await fetch(`/api/group/my?userId=${userId}`, {
                    headers: getHeaders()
                })
                const data = await response.json()
                document.getElementById('groupsResult').textContent = JSON.stringify(data, null, 2)
            } catch (e) {
                document.getElementById('groupsResult').textContent = 'Error: ' + e.message
            }
        }

        async function createGroupTest() {
            const name = document.getElementById('groupName').value
            try {
                const response = await fetch('/api/group/create', {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({
                        name: name,
                        ownerId: userId,
                        memberIds: []
                    })
                })
                const data = await response.json()
                document.getElementById('createResult').textContent = JSON.stringify(data, null, 2)

                // 更新 clearUnread 测试的输入框
                if (data.id) {
                    document.getElementById('convId').value = 'g' + data.id
                }
            } catch (e) {
                document.getElementById('createResult').textContent = 'Error: ' + e.message
            }
        }

        async function clearUnreadTest() {
            const convId = document.getElementById('convId').value
            let convIdNum = convId

            // 群聊格式转换
            if (convId.startsWith('g')) {
                convIdNum = parseInt(convId.substring(1), 10)
            }

            try {
                const response = await fetch('/api/conversation/unread/clear', {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({
                        conversationId: convIdNum,
                        userId: userId
                    })
                })
                const data = await response.json()
                document.getElementById('clearResult').textContent = JSON.stringify(data, null, 2)
            } catch (e) {
                document.getElementById('clearResult').textContent = 'Error: ' + e.message
            }
        }

        // 页面加载时获取群组列表
        window.onload = () => {
            if (token) {
                getMyGroups()
            } else {
                document.getElementById('groupsResult').textContent = '请先登录'
            }
        }
    </script>
</body>
</html>
