<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>钉图</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; }
  body { font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; }
  /* 不能用 -webkit-app-region: drag 铺满整块：那会把页面变成"非客户区"，
     真实鼠标的右键被 Windows 拿去找系统菜单、滚轮也不交给页面（页内合成事件测不出来，
     是假阳性）。拖动改成手动：pointerdown + 主进程 setPosition。 */
  #wrap { position: relative; width: 100%; height: 100%; cursor: default }
  /* 描边改用 outline：1px border 会把图挤成 894x598，1:1 原尺寸就破了 */
  #im { display: block; width: 100%; height: 100%; outline: 1px solid rgba(43, 107, 232, .5); outline-offset: -1px }
  #x { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border: 0; border-radius: 5px;
       background: rgba(28, 33, 44, .8); color: #fff; font-size: 12px; display: grid; place-items: center;
       cursor: pointer; -webkit-app-region: no-drag; opacity: 0; transition: opacity .12s; z-index: 3 }
  #wrap:hover #x { opacity: 1 }
  #note { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); padding: 4px 10px;
          border-radius: 6px; background: rgba(28, 33, 44, .88); color: #fff; font-size: 12px;
          opacity: 0; transition: opacity .15s; pointer-events: none; z-index: 4 }
  #note.on { opacity: 1 }
  /* ---- 右键菜单：抄内容区那一条规则（无描边 + 同一个阴影 + 12px 圆角 + 9x16 的行） ---- */
  .pin-menu { position: fixed; z-index: 9999; min-width: 200px; overflow: hidden; border-radius: 12px;
              background: rgba(255, 255, 255, 0.97); border: 0;
              box-shadow: 0 2px 14px rgba(20, 32, 56, 0.13); backdrop-filter: blur(8px);
              animation: pinMenuIn 0.15s ease-out; -webkit-app-region: no-drag }
  @keyframes pinMenuIn { from { opacity: 0; transform: scale(0.95) } to { opacity: 1; transform: none } }
  .pin-menu-list { padding: 4px 0 }
  .pin-menu-item { display: flex; align-items: center; gap: 10px; padding: 9px 16px; font-size: 13px;
                   color: #1c2434; cursor: pointer; transition: background .15s }
  .pin-menu-item .i-icon { display: flex; align-items: center; justify-content: center; flex-shrink: 0; transform: translateY(-1px) }
  .pin-menu-item span:not(.i-icon) { line-height: 1 }
  .pin-menu-item:hover { background: rgba(43, 107, 232, 0.07) }
  /* 置灰不消失：收藏和转发后端没有接口 */
  .pin-menu-item.off { color: #8a97ab; cursor: default }
  .pin-menu-item.off:hover { background: none }
  .pin-menu-divider { height: 1px; background: #e2e7f0; margin: 4px 0 }
</style>
</head>
<body>
  <div id="wrap">
    <img id="im" alt="" draggable="false" />
    <button id="x" title="关闭">✕</button>
    <span id="note"></span>
  </div>
  <div id="menu" class="pin-menu" hidden>
    <div class="pin-menu-list">
      <div class="pin-menu-item" data-a="copy"><span class="i-icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="5.5" y="5.5" width="8" height="8" rx="1.6"/><path d="M10.5 3.5V3a1.5 1.5 0 0 0-1.5-1.5H4A1.5 1.5 0 0 0 2.5 3v5A1.5 1.5 0 0 0 4 9.5h.5"/></svg></span><span>复制</span></div>
      <div class="pin-menu-item off" data-a="fav"><span class="i-icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M8 1.8l1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.6l-3.8 2 .7-4.3-3.1-3 4.3-.6z"/></svg></span><span>收藏</span></div>
      <div class="pin-menu-item" data-a="save"><span class="i-icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.8v8"/><path d="M4.6 6.6 8 10l3.4-3.4"/><path d="M2 12.4v1.2a.6.6 0 0 0 .6.6h10.8a.6.6 0 0 0 .6-.6v-1.2"/></svg></span><span>另存为</span></div>
      <div class="pin-menu-item off" data-a="fwd"><span class="i-icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2.2 2.4 6.6l4.6 1.6L8.6 14z"/><path d="M14 2.2 7 8.2"/></svg></span><span>转发</span></div>
      <div class="pin-menu-divider"></div>
      <div class="pin-menu-item" data-a="quit"><span class="i-icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M8 1.8v6"/><path d="M11.6 3.6a5.2 5.2 0 1 1-7.2 0"/></svg></span><span>退出</span></div>
      <div class="pin-menu-item" data-a="reset"><span class="i-icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M2.6 8a5.4 5.4 0 1 0 1.6-3.8"/><path d="M2.4 2.6v3.2h3.2"/></svg></span><span>还原</span></div>
    </div>
  </div>
  <script src="pin.js"></script>
</body>
</html>
