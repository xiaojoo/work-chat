version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: chat-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: chat
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat123456
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chat-net

  redis:
    image: redis:7-alpine
    container_name: chat-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass redis123456
    volumes:
      - redis_data:/data
    networks:
      - chat-net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: chat-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: chat
      RABBITMQ_DEFAULT_PASS: chat123456
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - chat-net

  cassandra:
    image: cassandra:4.1
    container_name: chat-cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: ChatCluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
    volumes:
      - cassandra_data:/var/lib/cassandra
    networks:
      - chat-net

  minio:
    image: minio/minio
    container_name: chat-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minio123456
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - chat-net

  consul:
    image: hashicorp/consul:latest
    container_name: chat-consul
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0
    volumes:
      - consul_data:/consul/data
    networks:
      - chat-net

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  cassandra_data:
  minio_data:
  consul_data:

networks:
  chat-net:
    driver: bridge
