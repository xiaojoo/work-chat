server:
  port: 8084

spring:
  application:
    name: chat-group

  datasource:
    url: jdbc:postgresql://172.20.70.38:5432/chat
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# 校验浏览器 access token，必须与 chat-user 的 jwt.secret 一致
jwt:
  # 签发/校验用户令牌的密钥：只从环境变量来，没给就不起服务（这把以前是硬编码默认值，而仓库是公开的）
  secret: ${JWT_SECRET:}

# 校验/签发服务间短期令牌，必须与 chat-gateway 的 INTERNAL_JWT_SECRET 一致
internal:
  jwt:
    secret: ${INTERNAL_JWT_SECRET:}
