server:
  port: 8083

spring:
  application:
    name: chat-message

  servlet:
    multipart:
      # 默认 1MB，图片一屏截图就超；文件走 MinIO 后这里的上限就是唯一闸门
      max-file-size: 20MB
      max-request-size: 20MB

cassandra:
  contact-points: localhost
  port: 9042
  local-datacenter: datacenter1
  keyspace: chat

# 文件/图片对象存储。endpoint 用 WSL 的 IP：NAT 模式下 Windows 侧 localhost 转不进去
minio:
  endpoint: ${MINIO_ENDPOINT:http://172.20.70.38:19000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minio123456}
  bucket: ${MINIO_BUCKET:chat-files}

# 校验浏览器 access token，必须与 chat-user 的 jwt.secret 一致
jwt:
  secret: ${JWT_SECRET:chat-system-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256}

# 校验服务间短期令牌，必须与 chat-gateway 的 INTERNAL_JWT_SECRET 一致
internal:
  jwt:
    secret: ${INTERNAL_JWT_SECRET:}
